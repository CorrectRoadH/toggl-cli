[package]
name = "toggl"
version = "0.7.6"
authors = [
  "CorrectRoadH <tylerchc92@gmail.com>",
  "Shantanu Raj <s@sraj.me>",
  "William Barbosa <heytherewill@gmail.com>"
]
categories = [
  "api-bindings",
  "command-line-utilities",
  "date-and-time",
]
description = "Unofficial command-line interface for Toggl Track using the v9 API."
homepage = "https://github.com/CorrectRoadH/toggl-cli"
keywords = ["cli", "time", "time-tracking", "toggl", "track"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/CorrectRoadH/toggl-cli"
edition = "2024"
rust-version = "1.91"

[dependencies]
# Argument parsing
clap = { version = "4.6", features = ["derive", "env", "suggestions"] }

# Terminal utilities
colored = "3.1"
colors-transform = "0.2.11"

# Storage
keyring = "4.1"

# Config
directories = "6.0"
regex = "1.13"
toml = "1.1"

# API
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.53", features = ["full"] }
base64 = "0.23"
async-trait = "0.1.91"

# Models
chrono = { version = "0.4.45", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
skim = { version = "5.6", default-features = false, features = ["frizbee"] }

[dev-dependencies]
# Testing
mockall = "0.15"
tokio-test = "0.4.5"

[package.metadata.dist]
# Config lives in dist-workspace.toml

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
